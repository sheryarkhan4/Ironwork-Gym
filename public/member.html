<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member - IronWorks Gym</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features.css">
</head>
<body data-page="members" data-title="Member" data-subtitle="Profile, payments and visits">
  <div id="content">

    <section class="panel" id="head-panel">
      <div class="profile-head">
        <span id="p-avatar"></span>
        <div class="profile-meta">
          <h2 id="p-name">Loading...</h2>
          <div id="p-badges"></div>
          <dl class="meta-grid" id="p-meta"></dl>
          <p class="note-banner" id="p-note" hidden></p>
        </div>
      </div>
      <div class="profile-actions" id="p-actions"></div>
    </section>

    <section class="grid-kpi">
      <article class="kpi"><div class="kpi-body"><p class="kpi-label">Total visits</p><h3 class="kpi-value" id="s-total">-</h3></div></article>
      <article class="kpi"><div class="kpi-body"><p class="kpi-label">Last 30 days</p><h3 class="kpi-value" id="s-month">-</h3></div></article>
      <article class="kpi"><div class="kpi-body"><p class="kpi-label">Last visit</p><h3 class="kpi-value" id="s-last">-</h3></div></article>
      <article class="kpi"><div class="kpi-body"><p class="kpi-label">Total paid</p><h3 class="kpi-value" id="s-paid">-</h3></div></article>
    </section>

    <section class="grid-main">
      <div class="panel">
        <div class="panel-head"><h2>Payments</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Note</th><th></th></tr></thead>
            <tbody id="p-payments"></tbody>
          </table>
        </div>
        <p id="p-payments-empty" class="empty" hidden>No payments recorded.</p>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Recent visits</h2></div>
        <ul class="list" id="p-visits"></ul>
      </div>
    </section>

  </div>

  <script src="common.js"></script>
  <script src="layout.js"></script>
  <script src="member.js"></script>
</body>
</html>
