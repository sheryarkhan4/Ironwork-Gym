<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members - IronWorks Gym</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="features.css">
</head>
<body data-page="members" data-title="Members" data-subtitle="Add, edit, renew and check in your members">
  <div id="content">

    <section class="toolbar">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="Search name, phone, plan or code..." autocomplete="off">
      </label>
      <div class="toolbar-actions">
        <a href="/cards.html" class="btn btn-ghost">Print cards</a>
        <a href="/api/export/members.csv" id="export-members" class="btn btn-ghost" hidden>Export CSV</a>
        <button type="button" id="add-btn">+ Add member</button>
      </div>
    </section>

    <div class="chips" id="status-chips" role="group" aria-label="Filter by status">
      <button type="button" class="chip is-active" data-status="">All <span id="count-all">0</span></button>
      <button type="button" class="chip" data-status="Active">Active <span id="count-active">0</span></button>
      <button type="button" class="chip" data-status="Expiring">Expiring <span id="count-expiring">0</span></button>
      <button type="button" class="chip" data-status="Expired">Expired <span id="count-expired">0</span></button>
      <button type="button" class="chip" data-status="Frozen">Frozen <span id="count-frozen">0</span></button>
      <button type="button" class="chip" data-status="Cancelled">Cancelled <span id="count-cancelled">0</span></button>
    </div>

    <p id="missing-phones" class="banner warn" hidden></p>

    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="sortable" data-sort="name" tabindex="0">Member</th>
              <th>Phone</th>
              <th class="sortable" data-sort="plan" tabindex="0">Plan</th>
              <th class="sortable" data-sort="end" tabindex="0">Ends</th>
              <th class="sortable" data-sort="status" tabindex="0">Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="members-body"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No members match your search.</p>
      <p id="result-count" class="page-msg"></p>
    </section>

  </div>

  <dialog id="member-dialog" aria-labelledby="member-title">
    <form id="member-form">
      <h2 id="member-title">Add member</h2>

      <div class="photo-row">
        <img id="photo-img" class="avatar avatar-lg" alt="" hidden>
        <span id="photo-initials" class="avatar avatar-lg avatar-initials">+</span>
        <div class="photo-tools">
          <input type="file" id="m-photo" accept="image/*">
          <button type="button" id="m-photo-remove" class="secondary-btn small-btn" hidden>Remove photo</button>
        </div>
      </div>

      <div class="field">
        <label for="m-name">Full name</label>
        <input type="text" id="m-name" maxlength="100" required>
      </div>
      <div class="field">
        <label for="m-phone">Phone</label>
        <input type="tel" id="m-phone" placeholder="0300 1234567" autocomplete="off" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="m-plan">Plan</label>
          <select id="m-plan"></select>
        </div>
        <div class="field">
          <label for="m-end">Membership ends</label>
          <input type="date" id="m-end" required>
        </div>
      </div>

      <label class="check"><input type="checkbox" id="m-remind" checked> Send renewal reminders</label>

      <p id="member-error" class="login-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="submit" id="member-save">Add member</button>
        <button type="button" id="member-cancel" class="secondary-btn">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="renew-dialog" aria-labelledby="renew-title">
    <form id="renew-form">
      <h2 id="renew-title">Renew membership</h2>

      <div class="field">
        <label for="renew-days">Extend by (days)</label>
        <input type="number" id="renew-days" min="1" max="730" step="1" value="30" required>
      </div>
      <p id="renew-preview" class="page-msg"></p>

      <label class="check"><input type="checkbox" id="renew-pay" checked> Record a payment</label>
      <div id="renew-pay-fields">
        <div class="field">
          <label for="renew-amount">Amount (PKR)</label>
          <input type="number" id="renew-amount" min="0.01" step="0.01">
        </div>
        <div class="field">
          <label for="renew-method">Method</label>
          <select id="renew-method">
            <option value="cash">Cash</option>
            <option value="easypaisa">Easypaisa</option>
            <option value="jazzcash">JazzCash</option>
            <option value="card">Card</option>
            <option value="transfer">Bank transfer</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <p id="renew-error" class="login-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="submit">Renew</button>
        <button type="button" id="renew-cancel" class="secondary-btn">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="common.js"></script>
  <script src="layout.js"></script>
  <script src="members.js"></script>
</body>
</html>
